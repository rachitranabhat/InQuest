<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Apply the saved theme before first paint (dark by default) so the page never flashes the wrong colours.
      try { if (localStorage.getItem("prism.theme") === "light") { document.documentElement.dataset.theme = "light"; document.querySelector('meta[name="color-scheme"]').setAttribute("content", "light"); } else { document.documentElement.dataset.theme = "dark"; } } catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
    <link rel="icon" href="/prism.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>INQUEST · Investigation platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
